<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">ItIsAlireza developer profile hero</title>
  <desc id="desc">Animated GitHub profile banner with an Alireza monogram and terminal-style developer profile.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset=".5" stop-color="#151515"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717" stop-opacity=".98"/>
      <stop offset=".6" stop-color="#202020" stop-opacity=".88"/>
      <stop offset="1" stop-color="#0b0b0b" stop-opacity=".96"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#22d3ee;#10b981;#7c3aed" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".5" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#10b981;#7c3aed;#22d3ee" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#7c3aed;#22d3ee;#10b981" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.45" fill="#e5e7eb" opacity=".74"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".5"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect width="1180" height="610" rx="34"/>
    </clipPath>

    <mask id="monoMask">
      <rect width="100%" height="100%" fill="black"/>
      <text x="242" y="375" text-anchor="middle"
            font-family="Arial Black, Inter, Arial, sans-serif"
            font-size="260" font-weight="900" fill="white">A</text>
    </mask>

    <clipPath id="terminalClip">
      <rect x="510" y="143" width="568" height="360" rx="14">
        <animate attributeName="height" values="0;360" dur="1.2s" begin=".55s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1180" height="610" fill="url(#bg)"/>

    <circle cx="160" cy="120" r="220" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;32 20;0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="130" r="250" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 28;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <rect x="26" y="26" width="1128" height="558" rx="30"
          fill="none" stroke="url(#accent)" stroke-width="1.4" opacity=".86">
      <animate attributeName="stroke-opacity" values=".35;1;.35" dur="5s" repeatCount="indefinite"/>
    </rect>

    <g filter="url(#shadow)">
      <rect x="42" y="50" width="402" height="510" rx="28" fill="url(#panel)" stroke="#fff" stroke-opacity=".08"/>
      <rect x="474" y="50" width="664" height="510" rx="28" fill="url(#panel)" stroke="#fff" stroke-opacity=".08"/>
    </g>

    <!-- Left identity panel -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="64" y="76" width="118" height="28" rx="14" fill="#0a0a0a" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="84" cy="90" r="4" fill="#f87171"/>
      <circle cx="100" cy="90" r="4" fill="#fbbf24"/>
      <circle cx="116" cy="90" r="4" fill="#34d399"/>
      <text x="64" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="13" fill="#94a3b8">/identity/alireza</text>

      <rect x="64" y="140" width="358" height="336" rx="22" fill="#0b0b0b" stroke="#fff" stroke-opacity=".08"/>
      <rect x="64" y="140" width="358" height="336" rx="22" fill="url(#dots)" mask="url(#monoMask)" opacity=".95"/>

      <text x="243" y="508" text-anchor="middle"
            font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#f8fafc">
        ALIREZA SHIRZAD
      </text>
      <text x="243" y="535" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="13" fill="#94a3b8">
        FULL-STACK ENGINEER · CREATOR
      </text>
    </g>

    <!-- Right terminal panel -->
    <g clip-path="url(#terminalClip)">
      <rect x="506" y="76" width="164" height="28" rx="14" fill="#0a0a0a" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="526" cy="90" r="4" fill="#f87171"/>
      <circle cx="542" cy="90" r="4" fill="#fbbf24"/>
      <circle cx="558" cy="90" r="4" fill="#34d399"/>
      <text x="580" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="12" fill="#94a3b8">profile.ts</text>

      <text x="510" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="16" fill="#22d3ee">$ whoami</text>
      <text x="510" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="24" font-weight="700" fill="#f8fafc">@ItIsAlireza</text>

      <text x="510" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#a78bfa">const</text>
      <text x="566" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#e2e8f0">developer = {</text>

      <text x="534" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#94a3b8">focus:</text>
      <text x="604" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#34d399">"scalable products"</text>

      <text x="534" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#94a3b8">mobile:</text>
      <text x="614" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#34d399">["Flutter", "Dart"]</text>

      <text x="534" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#94a3b8">backend:</text>
      <text x="624" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#34d399">[".NET", "Node.js"]</text>

      <text x="534" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#94a3b8">frontend:</text>
      <text x="634" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#34d399">["React", "TypeScript"]</text>

      <text x="534" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#94a3b8">building:</text>
      <text x="634" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#34d399">["Docsy", "Vantel"]</text>

      <text x="534" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#94a3b8">team:</text>
      <text x="594" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#34d399">"AstroDevs"</text>

      <text x="510" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" fill="#e2e8f0">};</text>

      <text x="510" y="495" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="16" fill="#22d3ee">$ status</text>
      <text x="602" y="495" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="16" fill="#f8fafc">shipping useful software</text>

      <rect x="862" y="482" width="10" height="18" rx="2" fill="#22d3ee" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="806" y="535" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#64748b">
      github.com/ItIsAlireza
    </text>
  </g>
</svg>
